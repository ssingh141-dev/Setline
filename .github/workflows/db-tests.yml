name: Database tests

# Runs the permission and approval tests on every push.
# Spins up a throwaway local Supabase; never touches the real project.
on:
  push:
  pull_request:

jobs:
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Start a local database with the schema and sample data
        run: supabase db start
      - name: Run tests
        run: supabase test db
